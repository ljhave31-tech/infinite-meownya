const $=id=>document.getElementById(id);
const clock=new THREE.Clock();

// keep the cat on the island
function clampIsland(p){const d=Math.hypot(p.x,p.z);if(d>R){p.x*=R/d;p.z*=R/d;}return p;}

// pointer: tap = walk there, drag = orbit, wheel / pinch = zoom
const ptrs=new Map(),rc=new THREE.Raycaster(),mv=new THREE.Vector2();

  noon:     {name:'Noon',icon:'🌞',sub:'Sun straight overhead',sky:0x9adcf8,hemiSky:0xffffff,hemiGnd:0xc4d8b4,hemiI:1.2,sun:0xffffff,sunI:1.05,el:88,glass:0xe6f6ff,cloud:0xffffff,disc:1,ambient:0xffffff,ambI:0},

  glass.forEach(g=>g.m.color.copy(cur.glass));clouds.forEach(g=>g.m.color.copy(cur.cloud));
  discs.forEach(d=>{d.m.opacity=d.o*Math.max(0,cur.disc);d.m.visible=cur.disc>.03;});
  const hex='#'+cur.sky.getHexString();document.documentElement.style.setProperty('--sky',hex);document.body.style.background=hex;
  const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.setAttribute('content',hex);
 }
 let last=performance.now();(function tick(n){requestAnimationFrame(tick);const dt=Math.min(.1,(n-last)/1000);last=n;apply(dt);})(last);

 // ---- UI ----
 const btn=document.getElementById('fxBtn'),menu=document.getElementById('fxMenu'),items={};
 Object.keys(PRESETS).forEach(k=>{const p=PRESETS[k],b=document.createElement('button');
  b.innerHTML='<span class="ic">'+p.icon+'</span><span>'+p.name+'<small>'+p.sub+'</small></span>';
  b.onclick=()=>{choose(k);menu.classList.remove('open');};menu.appendChild(b);items[k]=b;});
 function choose(k,silent){setPreset(k);Object.keys(items).forEach(i=>items[i].classList.toggle('sel',i===k));if(!silent)try{localStorage.setItem('worldTimeOfDay',k);}catch(e){}}
 const tog=v=>menu.classList.toggle('open',v);
 ['pointerdown','touchstart','mousedown'].forEach(ev=>{btn.addEventListener(ev,e=>e.stopPropagation());menu.addEventListener(ev,e=>e.stopPropagation());});
 btn.onclick=e=>{e.stopPropagation();tog();};
 addEventListener('pointerdown',e=>{if(!menu.contains(e.target)&&e.target!==btn&&!btn.contains(e.target))tog(false);});
 addEventListener('keydown',e=>{if(e.key==='Escape')tog(false);else if((e.key==='e'||e.key==='E')&&!e.ctrlKey&&!e.metaKey&&!e.altKey)tog();});
 // keep the chosen time of day when teleporting between maps
 let saved=null;try{saved=localStorage.getItem('worldTimeOfDay');}catch(e){}
 if(saved&&PRESETS[saved]){choose(saved,true);// start instantly, no fade-in from default
  for(let i=0;i<40;i++)apply(.5);}
})();
</script>
<!-- SHADOW CAT NPC (red eyes) -->
<script>
(function(){
 const T3=THREE,title=document.title;
 const MK=/bedroom/i.test(title)?'bed':/field/i.test(title)?'field':'plaza';
 const BB=MK==='bed'?[-6.2,6.2,-4.2,4.2]:MK==='field'?[-21,21,-21,21]:[-16,20,-17,20];
 const inReg=MK==='bed'?(x,z)=>Math.abs(x)<6.2&&Math.abs(z)<4.2:MK==='field'?(x,z)=>Math.hypot(x,z)<21:(x,z)=>x>-16&&x<20&&z>-17&&z<20;
 const rn=(a,b)=>a+Math.random()*(b-a);
 const free=(x,z,c)=>decor.every(k=>k.soft||k.r<=0||Math.hypot(x-k.x,z-k.z)>k.r+c);
 function spot(ok,clear){for(let i=0;i<90;i++){const x=rn(BB[0],BB[1]),z=rn(BB[2],BB[3]);if(inReg(x,z)&&free(x,z,i<60?clear:.5)&&(!ok||ok(x,z)))return{x,z};}return null;}
 function mkTex(stops){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);stops.forEach(s=>gr.addColorStop(s[0],s[1]));g.fillStyle=gr;g.fillRect(0,0,64,64);return new T3.CanvasTexture(c);}
 const glowTex=mkTex([[0,'rgba(255,80,60,.95)'],[.35,'rgba(255,20,20,.45)'],[1,'rgba(255,0,0,0)']]);
 const smokeTex=mkTex([[0,'rgba(22,10,34,.95)'],[.5,'rgba(22,10,34,.45)'],[1,'rgba(22,10,34,0)']]);

 // ---- the cat: charcoal-black, purple-tinted, glowing red eyes ----
 const BODY=0x15111c,gy=player.position.y;
 const w=cat(BODY,0x3b2650);w.position.set(0,gy,0);w.visible=false;scene.add(w);
 const B=w.userData.body,U=B.userData,mats=new Set(),eyeMats=[],glows=[];
 w.traverse(o=>{if(!o.isMesh)return;const m=o.material;if(!m||m.isMeshBasicMaterial)return;
  if(m.vertexColors){const a=o.geometry.attributes.color,c=new T3.Color(BODY);for(let i=0;i<a.count;i++)a.setXYZ(i,c.r,c.g,c.b);a.needsUpdate=true;}
  else{const h=m.color.getHex(),r=h>>16&255,g=h>>8&255,b=h&255;
   if(r>200&&g>200&&b>200)m.color.setHex(0x241d2e);       // white patches -> shadow grey
   else if(r>200&&g<200)m.color.setHex(0x2d2238);          // pink pads / nose -> dusk purple
   else if(h===0xa88e9c)m.color.setHex(0x5a4d6b);}         // whiskers
  m.emissive.setHex(0x150c20);mats.add(m);});
 U.eyes.forEach(e=>{
  e.geometry=new T3.SphereGeometry(.13,12,10);
  e.material=new T3.MeshBasicMaterial({color:0xff1414,transparent:true});eyeMats.push(e.material);
  const pu=mesh(new T3.SphereGeometry(.05,8,8),new T3.MeshBasicMaterial({color:0x120000,transparent:true}),e.position.x,e.position.y,e.position.z+.11);
  pu.scale.set(.32,1.7,.9);U.top.add(pu);eyeMats.push(pu.material);   // slit pupil
  const gl=new T3.Sprite(new T3.SpriteMaterial({map:glowTex,transparent:true,depthWrite:false,opacity:.7}));
  gl.scale.set(.8,.8,1);gl.position.set(e.position.x,e.position.y,e.position.z+.14);U.top.add(gl);glows.push(gl);eyeMats.push(gl.material);});
 U.hls.forEach(h=>{const s=h.position.x>0?1:-1;h.position.set(s*.24,1.61,.77);h.material.color.setHex(0xffd6d6);h.material.transparent=true;eyeMats.push(h.material);});
 const rl=new T3.PointLight(0xff2020,.5,5);rl.position.set(0,1.6,1);U.top.add(rl);

 // ground shadow pool
 const pool=mesh(new T3.PlaneGeometry(2.8,2.8),new T3.MeshBasicMaterial({map:smokeTex,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}),0,gy+.04,0);
 pool.rotation.x=-Math.PI/2;pool.visible=false;scene.add(pool);

 // drifting shadow wisps
 const wisps=[];for(let i=0;i<44;i++){const s=new T3.Sprite(new T3.SpriteMaterial({map:smokeTex,transparent:true,depthWrite:false,opacity:0}));s.visible=false;s.userData={life:0,max:1,vx:0,vy:0,vz:0,sz:1,on:false};scene.add(s);wisps.push(s);}
 function puff(n,burst){for(let k=0;k<n;k++){const s=wisps.find(q=>!q.userData.on);if(!s)return;const u=s.userData,p=w.position;
  s.position.set(p.x+rn(-.55,.55),gy+rn(.15,1.8),p.z+rn(-.55,.55));
  u.on=true;u.life=0;u.max=rn(1.1,2);u.vx=rn(-.3,.3)*(burst?2:1);u.vz=rn(-.3,.3)*(burst?2:1);u.vy=rn(.3,.9);u.sz=rn(.55,1.1)*(burst?1.3:1);s.visible=true;}}

 // ---- behaviour: lurks, stares, melts away if you get close, then re-emerges ----
 let state='hidden',timer=2.5,op=0,goal=null,wait=0,idle=0,liveT=0,stalkT=0,lk=0,T=0,acc=0,last=performance.now();
 const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
 function place(){const P=player.position;
  let s=spot((x,z)=>{const d=Math.hypot(x-P.x,z-P.z);return d>6&&d<12;},1.2)||spot((x,z)=>Math.hypot(x-P.x,z-P.z)>5,.9)||spot(null,.7)||{x:0,z:0};
  w.position.set(s.x,gy,s.z);w.rotation.y=Math.atan2(P.x-s.x,P.z-s.z);goal=null;wait=2+Math.random()*2;idle=0;}
 function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  const P=player.position,p=w.position,dx=P.x-p.x,dz=P.z-p.z,dp=Math.hypot(dx,dz);let spd=0;
  if(state==='hidden'){timer-=dt;if(timer<=0){place();state='in';w.visible=true;puff(14,true);}}
  else if(state==='in'){op=Math.min(1,op+dt/.9);if(op>=1){state='live';liveT=0;stalkT=rn(25,45);}}
  else if(state==='live'){
   liveT+=dt;stalkT-=dt;
   if((dp<3.2&&liveT>1.2)||stalkT<=0){state='out';puff(16,true);}
   else if(wait>0){wait-=dt;idle+=dt;
    if(dp<12){p.y=gy;w.rotation.y+=wrap(Math.atan2(dx,dz)-w.rotation.y)*Math.min(1,dt*2);}}   // sits and stares at you
   else if(!goal){const s=spot((x,z)=>{const d=Math.hypot(x-p.x,z-p.z);return d>3&&d<8;},.9);if(s)goal=s;else wait=2;}
   else{spd=2.1;idle=0;if(walk(w,goal,spd,dt,true)){goal=null;wait=3+Math.random()*4;spd=0;}}
  }
  else if(state==='out'){op=Math.max(0,op-dt/.7);if(op<=0){state='hidden';timer=rn(4,9);w.visible=false;}}
  p.y=gy;
  if(w.visible){
   anim(w,spd,T,dt,Math.min(idle,9));                  // idle capped so it sits and stares, never sleeps
   if(dp<16){let a=Math.max(-.9,Math.min(.9,wrap(Math.atan2(dx,dz)-w.rotation.y)));lk+=(a-lk)*Math.min(1,dt*4);U.top.rotation.y=lk;}
  }
  // fade + glow
  mats.forEach(m=>{m.transparent=op<.995;m.opacity=op;});
  const eo=Math.pow(op,.45),pulse=.6+.2*Math.sin(T*3.1)+(dp<9?.2:0);
  eyeMats.forEach(m=>{if(!m.map)m.opacity=eo;});glows.forEach(g=>g.material.opacity=eo*pulse);
  rl.intensity=.5*eo*(.8+.2*Math.sin(T*3.1));
  pool.visible=op>.01;pool.position.x=p.x;pool.position.z=p.z;pool.material.opacity=.7*op*(.85+.15*Math.sin(T*1.7));
  // wisps
  if(w.visible){acc+=dt*14*op;while(acc>=1){acc--;puff(1,false);}}
  wisps.forEach(s=>{const u=s.userData;if(!u.on)return;u.life+=dt;const k=u.life/u.max;
   if(k>=1){u.on=false;s.visible=false;return;}
   s.position.x+=u.vx*dt;s.position.y+=u.vy*dt;s.position.z+=u.vz*dt;
   const sc=u.sz*(.8+k*1.4);s.scale.set(sc,sc,1);s.material.opacity=Math.sin(Math.PI*k)*.55;});
 }
 requestAnimationFrame(tick);
})();
</script>
