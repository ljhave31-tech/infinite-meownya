<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f0d9cf">
<title>The Old Plaza</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#5a3b4e;--pill:#fff8f0;--accent:#ff8fa8;--sky:#f0d9cf;box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0}
#area{position:fixed;top:22%;left:50%;transform:translateX(-50%);font-size:28px;font-weight:600;color:#fff;text-shadow:0 3px 0 #b86a86,0 0 14px rgba(0,0,0,.25);opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap;text-align:center}
#area small{display:block;font-size:14px;font-weight:500}
#hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--pill);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;box-shadow:0 3px 0 #f0c9b8;pointer-events:none;transition:opacity .8s;white-space:nowrap}
#joy{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:130px;height:130px;z-index:14;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#joyBase{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 38%,rgba(255,250,244,.92),rgba(255,222,234,.78));border:4px solid #f0c9b8;box-shadow:0 4px 0 #e8b4a0,inset 0 0 18px rgba(255,143,168,.28);box-sizing:border-box}
#joyBase svg{position:absolute;left:50%;top:50%;width:62%;height:62%;transform:translate(-50%,-50%);opacity:.28}
#joyBase i{position:absolute;width:7px;height:7px;border-radius:50%;background:#e9a3b8;opacity:.8}
#joyBase i:nth-child(2){left:50%;top:7px;margin-left:-3.5px}#joyBase i:nth-child(3){left:50%;bottom:7px;margin-left:-3.5px}#joyBase i:nth-child(4){top:50%;left:7px;margin-top:-3.5px}#joyBase i:nth-child(5){top:50%;right:7px;margin-top:-3.5px}
#joyKnob{position:absolute;left:50%;top:50%;width:62px;height:62px;transform:translate(-50%,-50%);transition:transform .12s ease-out;filter:drop-shadow(0 3px 0 rgba(160,60,90,.45))}
#joyKnob.drag{transition:none}
#joyKnob svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="hint">Tap / click to walk · WASD or joystick · drag to look · scroll to zoom</div>
<div id="area">The Old Plaza<small>Forgotten Square</small></div>
<div id="joy"><div id="joyBase"><span></span><i></i><i></i><i></i><i></i></div><div id="joyKnob"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= MAP: The Old Plaza =================
const SEED=20261020;let _s=SEED;const rnd=()=>{_s=_s+0x6D2B79F5|0;let t=Math.imul(_s^_s>>>15,1|_s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const rr=(a,b)=>a+rnd()*(b-a);
const H=26,SKY=0xf0d9cf,scene=new THREE.Scene();
scene.background=new THREE.Color(SKY); scene.fog=new THREE.Fog(SKY,42,125);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,240);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2)); ren.setSize(innerWidth,innerHeight);
document.body.prepend(ren.domElement);
scene.add(new THREE.HemisphereLight(0xfff4ea,0xc9b4be,.9));
const sun=new THREE.DirectionalLight(0xffe0b8,.7); sun.position.set(-10,14,-8); scene.add(sun);
const M=(c,e)=>new THREE.MeshLambertMaterial({color:c,emissive:e||0x000000});
const MD=c=>new THREE.MeshLambertMaterial({color:c,side:THREE.DoubleSide});
const mesh=(g,m,x=0,y=0,z=0)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);return o};
const decor=[],sway=[];let plazaAnim=()=>{};
const flat=(g,c,x,y,z,op)=>{const m=mesh(g,op?new THREE.MeshLambertMaterial({color:c,transparent:true,opacity:op}):M(c),x,y,z);m.rotation.x=-Math.PI/2;scene.add(m);return m;};

// ---------- textures ----------
function stoneTex(){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
 x.fillStyle='#857a7e';x.fillRect(0,0,512,512);
 const n=8,s=512/n;
 for(let j=0;j<n;j++)for(let i=-1;i<=n;i++){const ox=(j%2)*s/2,l=176+Math.floor(rnd()*30);
  x.fillStyle='rgb('+(l+10)+','+l+','+(l-2)+')';x.fillRect(i*s+ox+3,j*s+3,s-6,s-6);
  if(rnd()<.18){x.fillStyle='rgba(150,190,140,.35)';x.beginPath();x.arc(i*s+ox+rr(8,s-8),j*s+rr(8,s-8),rr(6,14),0,6.283);x.fill();}}
 x.strokeStyle='rgba(70,60,66,.8)';x.lineWidth=1.6;
 for(let k=0;k<9;k++){let px=rr(0,512),py=rr(0,512);x.beginPath();x.moveTo(px,py);for(let m=0;m<5;m++){px+=rr(-26,26);py+=rr(-26,26);x.lineTo(px,py);}x.stroke();}
 return new THREE.CanvasTexture(c);}
function stripeTex(c1,c2){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
 for(let i=0;i<4;i++){x.fillStyle=i%2?c2:c1;x.fillRect(i*16,0,16,64);}
 x.fillStyle='rgba(120,100,100,.18)';for(let i=0;i<14;i++)x.fillRect(rr(0,60),rr(0,60),rr(2,8),rr(2,8));
 return new THREE.CanvasTexture(c);}
function clockTex(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
 x.fillStyle='#e8dccb';x.beginPath();x.arc(128,128,124,0,6.283);x.fill();
 x.strokeStyle='#6a5560';x.lineWidth=8;x.stroke();x.fillStyle='#6a5560';
 for(let i=0;i<12;i++){const a=i*Math.PI/6;x.beginPath();x.arc(128+Math.sin(a)*100,128-Math.cos(a)*100,i%3?4:7,0,6.283);x.fill();}
 x.lineCap='round';x.strokeStyle='#4d3b46';
 x.lineWidth=10;x.beginPath();x.moveTo(128,128);x.lineTo(128+Math.sin(2.18)*56,128-Math.cos(2.18)*56);x.stroke();   // hour hand (stopped)
 x.lineWidth=6;x.beginPath();x.moveTo(128,128);x.lineTo(128+Math.sin(1.05)*88,128-Math.cos(1.05)*88);x.stroke();    // minute hand (stopped)
 x.strokeStyle='rgba(80,66,72,.7)';x.lineWidth=2.5;x.beginPath();x.moveTo(200,40);x.lineTo(170,90);x.lineTo(182,120);x.lineTo(150,160);x.stroke();
 return new THREE.CanvasTexture(c);}

// ---------- ground ----------
const outer=mesh(new THREE.CircleGeometry(300,48),M(0xcdbfb6),0,.5,0);outer.rotation.x=-Math.PI/2;scene.add(outer);
const ground=mesh(new THREE.CircleGeometry(620,48),new THREE.MeshBasicMaterial({visible:false}));ground.rotation.x=-Math.PI/2;ground.position.y=.55;scene.add(ground);
{const tex=stoneTex();tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(6.5,6.5);tex.anisotropy=4;
 const side=M(0x9b8f92);scene.add(mesh(new THREE.BoxGeometry(H*2,1.2,H*2),[side,side,new THREE.MeshLambertMaterial({map:tex}),side,side,side],0,-.05,0));}
// medallion rings + spokes around the fountain
flat(new THREE.CircleGeometry(6.2,48),0xd6c8c4,0,.563,0,.55);
flat(new THREE.RingGeometry(6.2,6.7,48),0x8a7c82,0,.57,0);
flat(new THREE.RingGeometry(14.7,15.2,64),0x8a7c82,0,.57,0);
for(let k=0;k<8;k++){const a=k*Math.PI/4,m=flat(new THREE.PlaneGeometry(.32,8),0x9a8c92,-Math.sin(a)*10.7,.568,-Math.cos(a)*10.7);m.rotation.set(-Math.PI/2,0,a);}
// missing tiles, rubble, puddles
for(let i=0;i<12;i++){let x,z;do{x=rr(-H+2,H-2);z=rr(-H+2,H-2);}while(Math.hypot(x,z)<7);const m=flat(new THREE.PlaneGeometry(rr(.9,1.6),rr(.9,1.6)),0x6d6065,x,.572,z);m.rotation.z=rnd()*1.5;}
for(let i=0;i<25;i++){let x,z;do{x=rr(-H+1.5,H-1.5);z=rr(-H+1.5,H-1.5);}while(Math.hypot(x,z)<5.4);const s=rr(.14,.3),o=mesh(new THREE.DodecahedronGeometry(s),M(0xb4a8ab),x,.55+s*.5,z);o.scale.y=.6;o.rotation.set(rnd()*3,rnd()*3,0);scene.add(o);}
[[-9,12,1.5],[10,-11,1.2],[14,14,1.1],[-14,-9,1.3]].forEach(p=>{const m=flat(new THREE.CircleGeometry(p[2],20),0xa9bccb,p[0],.576,p[1],.85);m.scale.y=.7;m.rotation.z=rnd()*3;});
// overgrown grass patches + weeds
const GR=[0x9fc79a,0xb3d0a0,0x8fbf8a];
[[-15,22,3],[16,21,2.6],[-23,-14,3],[23,12,2.4],[8,-22,2.6],[-9,-23,2.2]].forEach(p=>{flat(new THREE.CircleGeometry(p[2],18),GR[Math.floor(rnd()*3)],p[0],.578,p[1],.9);
 for(let i=0;i<6;i++){const a=rnd()*6.28,r=rnd()*p[2]*.8;tuft(p[0]+Math.cos(a)*r,p[1]+Math.sin(a)*r);}});
function tuft(x,z){const g=new THREE.Group();g.position.set(x,.55,z);
 for(let i=0;i<3;i++){const c=mesh(new THREE.ConeGeometry(.06,rr(.35,.7),4),M(i%2?0x9fbf8a:0xb7c99a),rr(-.1,.1),.25,rr(-.1,.1));c.rotation.set(rr(-.4,.4),0,rr(-.4,.4));g.add(c);}
 if(rnd()<.3)g.add(mesh(new THREE.SphereGeometry(.09,6,5),M([0xff9fb5,0xffffff,0xffd36e][Math.floor(rnd()*3)]),0,.55,0));
 scene.add(g);}
for(let i=0;i<45;i++){let x,z;if(rnd()<.6){const e=rnd()<.5;x=e?rr(-H+.8,H-.8):(rnd()<.5?-1:1)*rr(H-5,H-.8);z=e?(rnd()<.5?-1:1)*rr(H-5,H-.8):rr(-H+.8,H-.8);}else{x=rr(-H+2,H-2);z=rr(-H+2,H-2);}
 if(Math.hypot(x,z)<5.4||(Math.abs(x)<5&&z>H-4))continue;tuft(x,z);}
// fallen leaves on the stones
const LEAFC=[0xd9a066,0xc98a5a,0xe0b878,0xb77a52,0xcfa48a];
function leaf(x,y,z){const m=mesh(new THREE.CircleGeometry(rr(.14,.24),5),MD(LEAFC[Math.floor(rnd()*5)]),x,y,z);m.rotation.set(-Math.PI/2,0,rnd()*6.28);scene.add(m);return m;}
for(let i=0;i<70;i++){let x,z;do{x=rr(-H+1,H-1);z=rr(-H+1,H-1);}while(Math.hypot(x,z)<5.4);leaf(x,.585,z);}

// ---------- the dry fountain ----------
(function(){const g=new THREE.Group();g.position.set(0,.55,0);scene.add(g);const st=0xd2c7c6;
 g.add(mesh(new THREE.CylinderGeometry(4.95,5.1,.3,32),M(0xaa9ea4),0,.15,0));
 g.add(mesh(new THREE.CylinderGeometry(4.4,4.5,1.1,32,1,true),MD(st),0,.55,0));
 g.add(mesh(new THREE.CylinderGeometry(3.9,3.9,1.1,32,1,true),MD(0xbfb3b4),0,.55,0));
 const rim=mesh(new THREE.RingGeometry(3.9,4.45,32),M(0xe0d6d4),0,1.1,0);rim.rotation.x=-Math.PI/2;g.add(rim);
 const fl=mesh(new THREE.CircleGeometry(3.9,32),M(0x938689),0,.34,0);fl.rotation.x=-Math.PI/2;g.add(fl);
 g.add(mesh(new THREE.CylinderGeometry(.65,.9,2.3,14),M(0xd2c7c6),0,1.2,0));
 g.add(mesh(new THREE.CylinderGeometry(1.9,.9,.45,24),M(0xcfc3c2),0,2.55,0));
 const bf=mesh(new THREE.CircleGeometry(1.7,24),M(0x938689),0,2.78,0);bf.rotation.x=-Math.PI/2;g.add(bf);
 // mossy stone cat statue, one ear chipped off
 const sm=M(0xbfb4b8);
 const bd=mesh(new THREE.SphereGeometry(.6,14,10),sm,0,3.4,0);bd.scale.y=1.2;g.add(bd);
 g.add(mesh(new THREE.SphereGeometry(.46,14,10),sm,0,4.25,0));
 g.add(mesh(new THREE.ConeGeometry(.17,.34,4),sm,-.26,4.62,0));
 g.add(mesh(new THREE.SphereGeometry(.07,6,5),M(0x6d6065),.27,4.5,.3));
 [[.3,3.2,.4,.3],[-.4,3.7,.3,.22],[.1,4.3,.38,.15]].forEach(m=>{const o=mesh(new THREE.SphereGeometry(m[3],7,6),M(0x93b88c),m[0],m[1],m[2]);o.scale.z=.5;g.add(o);});
 const ear=mesh(new THREE.ConeGeometry(.17,.34,4),sm,1.2,.5,2.6);ear.rotation.z=1.4;g.add(ear);   // the missing ear
 const ch=mesh(new THREE.BoxGeometry(1.1,.5,.8),M(0xe0d6d4),-5.6,.35,1.6);ch.rotation.y=.5;g.add(ch);  // chunk fallen off the rim
 for(let i=0;i<9;i++){const a=rnd()*6.28,r=rnd()*3.3;leaf(Math.cos(a)*r,.9,Math.sin(a)*r);}
 for(let i=0;i<5;i++){const a=rnd()*6.28,r=rnd()*1.4;leaf(Math.cos(a)*r,3.35,Math.sin(a)*r);}
 decor.push({x:0,z:0,r:4.95});})();

// ---------- broken colonnade ----------
function column(x,z,broken){const g=new THREE.Group();g.position.set(x,.55,z);
 g.add(mesh(new THREE.BoxGeometry(1.5,.5,1.5),M(0xc9bdbd),0,.25,0));
 const h=broken?2.1:5.2;
 g.add(mesh(new THREE.CylinderGeometry(.55,.62,h,12),M(0xdad0cf),0,.5+h/2,0));
 if(!broken)g.add(mesh(new THREE.BoxGeometry(1.5,.4,1.5),M(0xc9bdbd),0,.5+h+.2,0));
 else{g.add(mesh(new THREE.CylinderGeometry(.42,.55,.4,5),M(0xcfc3c2),0,.5+h+.1,0));
  const d=mesh(new THREE.CylinderGeometry(.55,.55,1.1,12),M(0xdad0cf),1.4,.55,.9);d.rotation.set(0,rnd()*3,Math.PI/2);g.add(d);
  const cp=mesh(new THREE.BoxGeometry(1.2,.35,1.2),M(0xc9bdbd),-1.1,.2,1.2);cp.rotation.y=.6;g.add(cp);}
 const mo=mesh(new THREE.SphereGeometry(.35,8,6),M(0x9dc29a),.45,.75,.4);mo.scale.y=.5;g.add(mo);
 scene.add(g);decor.push({x,z,r:.9});}
for(let k=0;k<8;k++){const a=k*Math.PI/4+Math.PI/8;column(Math.cos(a)*13,Math.sin(a)*13,k===1||k===4||k===6);}

// ---------- benches ----------
function bench(x,z,tipped){const g=new THREE.Group();g.position.set(x,.55,z);g.rotation.y=Math.atan2(-x,-z);
 const w=M(0x9b7c6a),ir=M(0x5a4a5a);
 const s=mesh(new THREE.BoxGeometry(2.6,.12,.7),w,0,.55,0),b=mesh(new THREE.BoxGeometry(2.6,.7,.1),w,0,1.0,-.38);b.rotation.x=-.12;
 g.add(s,b);[-1.1,1.1].forEach(l=>g.add(mesh(new THREE.BoxGeometry(.1,.55,.7),ir,l,.28,0)));
 if(tipped){g.rotation.z=1.25;g.position.y=.9;g.position.x+=.4;}
 scene.add(g);decor.push({x,z,r:1.4});}
[[1,1,0],[-1,1,0],[-1,-1,1],[1,-1,0]].forEach(p=>bench(p[0]*6.4,p[1]*6.4,p[2]));

// ---------- lamp posts, tattered banners, a forgotten balloon ----------
const FADED=[0xc79aa0,0x9aa8c7,0xc7bb9a];
function lamp(x,z,lean,banner,i){const g=new THREE.Group();g.position.set(x,.55,z);g.rotation.z=lean||0;g.rotation.y=Math.atan2(-x,-z);
 g.add(mesh(new THREE.CylinderGeometry(.08,.14,4.4,8),M(0x5a4a5a),0,2.2,0));
 g.add(mesh(new THREE.CylinderGeometry(.22,.22,.25,8),M(0x5a4a5a),0,.15,0));
 g.add(mesh(new THREE.BoxGeometry(.6,.08,.08),M(0x5a4a5a),0,4.2,0));
 g.add(mesh(new THREE.BoxGeometry(.4,.55,.4),M(0xb9b0b6),0,4.65,0));
 g.add(mesh(new THREE.ConeGeometry(.35,.3,4),M(0x5a4a5a),0,5.1,0).rotateY(Math.PI/4));
 if(banner){const bn=mesh(new THREE.PlaneGeometry(.9,1.8),MD(FADED[i%3]),.35,3.1,0);bn.geometry.translate(0,-.9,0);bn.position.y=4.1;g.add(bn);sway.push(bn);}
 scene.add(g);decor.push({x,z,r:.4});}
lamp(-21,-21,.06,1,0);lamp(21,-21,-.05,1,1);lamp(-21,21,0,0,2);lamp(21,21,.08,1,2);lamp(-21,0,0,1,1);lamp(21,0,-.04,0,0);lamp(0,-21,0,0,1);lamp(-9,21,.05,0,0);
{const bg=new THREE.Group();bg.position.set(21.5,.55,20.2);   // faded balloon tied to the lamp
 bg.add(mesh(new THREE.CylinderGeometry(.01,.01,4,3),M(0xdddddd),0,2,0));
 const b=mesh(new THREE.SphereGeometry(.45,12,10),M(0xf2a0b8),0,4.4,0);b.scale.y=1.15;bg.add(b);scene.add(bg);
 const oy=bg.position.y;sway.push({isBalloon:1,o:bg,oy});}

// ---------- market stalls (empty tables, torn awnings) ----------
function stall(x,z){const g=new THREE.Group();g.position.set(x,.55,z);g.rotation.y=Math.atan2(-x,-z);
 g.add(mesh(new THREE.BoxGeometry(3.2,.12,1.4),M(0x9b7c6a),0,.95,0));
 [[-1.5,.65],[1.5,.65],[-1.5,-.65],[1.5,-.65]].forEach(p=>{g.add(mesh(new THREE.BoxGeometry(.12,.95,.12),M(0x7a5236),p[0],.48,p[1]*.9));g.add(mesh(new THREE.CylinderGeometry(.06,.07,2.5,6),M(0x7a5236),p[0]*1.1,1.25,p[1]*1.3));});
 const aw=mesh(new THREE.PlaneGeometry(3.9,2.4),new THREE.MeshLambertMaterial({map:stripeTex(0xe3b8b8,0xf1e8df),side:THREE.DoubleSide}),0,2.55,0);aw.rotation.x=-1.35;g.add(aw);
 const tr=mesh(new THREE.PlaneGeometry(.7,1),MD(0xe3b8b8),1.2,2.1,1.2);tr.geometry.translate(0,-.5,0);tr.position.y=2.3;g.add(tr);sway.push(tr);
 g.add(mesh(new THREE.BoxGeometry(.7,.5,.7),M(0xb98a5a),-.6,1.26,0));
 const c=mesh(new THREE.BoxGeometry(.7,.7,.7),M(0xb98a5a),2.2,.35,1.5);c.rotation.set(.2,.7,.3);g.add(c);
 scene.add(g);decor.push({x,z,r:2.2});}
stall(-19,-9);stall(-19,9);stall(19,-9);stall(19,9);

// ---------- dead trees with a few stubborn blossoms ----------
function deadTree(x,z){const g=new THREE.Group();g.position.set(x,.55,z);
 const tk=mesh(new THREE.CylinderGeometry(.28,.5,3.2,7),M(0x8a6a5a),0,1.6,0);tk.rotation.z=.08;g.add(tk);
 [[.9,3.2,.9],[-.9,3.5,-.8],[.2,3.9,-.6],[-.4,2.8,1]].forEach((b,i)=>{const br=mesh(new THREE.CylinderGeometry(.06,.14,1.8,5),M(0x8a6a5a),b[0]*.5,b[1],b[2]*.5);br.rotation.set(b[2]*.5,0,-b[0]*.6);g.add(br);
  if(i<3){const bl=mesh(new THREE.SphereGeometry(.28,8,6),M(0xf6c9d4),b[0]*1.0,b[1]+.7,b[2]*1.0);bl.scale.y=.8;g.add(bl);}});
 scene.add(g);decor.push({x,z,r:.9});}
deadTree(-22,15);deadTree(22,-16);

// ---------- crumbling buildings around the square ----------
function building(cx,cz,w,h,d,ry,wall,roofC){const g=new THREE.Group();g.position.set(cx,.55,cz);g.rotation.y=ry;scene.add(g);
 const A=o=>{g.add(o);return o;};
 A(mesh(new THREE.BoxGeometry(w,h,d),M(wall),0,h/2,0));
 A(mesh(new THREE.BoxGeometry(w+.5,.5,d+.5),M(0xb5a5a8),0,h+.25,0));
 const rh=2.6,sh=new THREE.Shape();sh.moveTo(-d/2-.3,0);sh.lineTo(0,rh);sh.lineTo(d/2+.3,0);
 const rg=new THREE.ExtrudeGeometry(sh,{depth:w+.6,bevelEnabled:false});rg.translate(0,0,-(w+.6)/2);rg.rotateY(Math.PI/2);
 A(mesh(rg,M(roofC),0,h+.5,0));
 A(mesh(new THREE.BoxGeometry(1,2,1),M(0xb5a5a8),rr(-w/3,w/3),h+2,rr(-1,1)));
 const n=Math.max(1,Math.floor((w-2)/3.6)),sp=(w-2)/n;
 for(let i=0;i<n;i++){const x=(i-(n-1)/2)*sp;

function clampIsland(p){const m=H-1.3;p.x=Math.max(-m,Math.min(m,p.x));const zm=Math.abs(p.x)<4?H+3:m;p.z=Math.max(-m,Math.min(zm,p.z));return p;}

// pointer: tap = walk there, drag = orbit, wheel / pinch = zoom
const ptrs=new Map(),rc=new THREE.Raycaster(),mv=new THREE.Vector2();

cv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});dragMoved=0;try{cv.setPointerCapture(e.pointerId);}catch(_){}

 if(e.type==='pointerup'&&ptrs.size===0&&dragMoved<=8)tapGround(e.clientX,e.clientY);};
cv.addEventListener('pointerup',upP);cv.addEventListener('pointercancel',upP);

function joyTick(){

 if(v.on){const P=player.position,fx_=P.x-cam.position.x,fz_=P.z-cam.position.z,l=Math.hypot(fx_,fz_)||1,f={x:fx_/l,z:fz_/l},r={x:-f.z,z:f.x};

  target=clampIsland({x:P.x+dx*3,z:P.z+dz*3});
  runMode=v.m>.8||performance.now()-joyT0>1000;   // hold the stick for 1s and the cat breaks into a run

}

 ren.render(scene,cam);
}
loop();

<button id="mapBtn" aria-label="Open map"><span>🗺️</span> Map</button>
<div id="mapMenu"><h4>Teleport to</h4></div>
<div id="mapFade"></div>
<script>
(function(){
 const MAPS=[{name:'The Old Plaza',sub:'Forgotten Square',icon:'⛲',file:'index.html'},{name:'The Bedroom',sub:'A quiet little room',icon:'🛏️',file:'bedroom.html'}];
 const here=(location.pathname.split('/').pop()||'index.html').toLowerCase(),btn=document.getElementById('mapBtn'),menu=document.getElementById('mapMenu'),fade=document.getElementById('mapFade');
 MAPS.forEach(m=>{const b=document.createElement('button'),cur=m.file===here||(here===''&&m.file==='index.html');
  b.innerHTML='<span class="ic">'+m.icon+'</span><span>'+m.name+'<small>'+(cur?'You are here':m.sub)+'</small></span>';b.disabled=cur;
  b.onclick=()=>{menu.classList.remove('open');fade.classList.add('on');setTimeout(()=>{location.href=m.file;},380);};menu.appendChild(b);});
 const tog=v=>menu.classList.toggle('open',v);
 btn.onclick=e=>{e.stopPropagation();tog();};
 menu.addEventListener('pointerdown',e=>e.stopPropagation());
 addEventListener('pointerdown',e=>{if(!menu.contains(e.target)&&e.target!==btn)tog(false);});
 addEventListener('keydown',e=>{if(e.key==='Escape')tog(false);else if((e.key==='m'||e.key==='M')&&!e.ctrlKey&&!e.metaKey&&!e.altKey)tog();});
 addEventListener('pageshow',()=>fade.classList.remove('on'));
})();
</script>
<!-- EFFECTS: time of day -->
<style>
#fxBtn{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:30;display:flex;align-items:center;gap:6px;background:var(--pill);color:var(--ink);border:0;border-radius:999px;padding:8px 14px;font:600 14px 'Fredoka',system-ui,sans-serif;box-shadow:0 3px 0 #f0c9b8;cursor:pointer;-webkit-tap-highlight-color:transparent}
#fxBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #f0c9b8}
#fxMenu{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:30;width:210px;background:var(--pill);border-radius:18px;padding:8px;box-shadow:0 4px 0 #f0c9b8,0 10px 24px rgba(90,59,78,.2);opacity:0;transform:translateY(-6px) scale(.9);transform-origin:top left;pointer-events:none;transition:opacity .18s,transform .18s}
#fxMenu.open{opacity:1;transform:none;pointer-events:auto}
#fxMenu h4{margin:4px 8px 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.55}
#fxMenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--ink);font:600 15px 'Fredoka',system-ui,sans-serif;text-align:left;padding:9px 10px;border-radius:12px;cursor:pointer}
#fxMenu button:hover{background:#ffe3ea}
#fxMenu button.sel{background:#fdeee6;box-shadow:inset 0 0 0 2px #ffb7c8}

<button id="fxBtn" aria-label="Open effects"><span>✨</span> Effects</button>
<div id="fxMenu"><h4>Time of day</h4></div>
<script>
(function(){
 const C=THREE.Color;
 const PRESETS={
  dawn:     {name:'Dawn',icon:'🌅',sub:'Soft pink sunrise',sky:0xf2b4c6,hemiSky:0xffd3e0,hemiGnd:0xa898b8,hemiI:.72,sun:0xffa59c,sunI:.62,el:9,glass:0xffc2d2,cloud:0xffc8d8,disc:1,ambient:0xffffff,ambI:0},
  day:      {name:'Day',icon:'☀️',sub:'Bright and clear',sky:0xbfe6f5,hemiSky:0xffffff,hemiGnd:0xb5c9a8,hemiI:1.05,sun:0xfff6dc,sunI:.9,el:62,glass:0xd7ebf7,cloud:0xffffff,disc:1,ambient:0xffffff,ambI:0},
  noon:     {name:'Noon',icon:'🌞',sub:'Sun straight overhead',sky:0x9adcf8,hemiSky:0xffffff,hemiGnd:0xc4d8b4,hemiI:1.2,sun:0xffffff,sunI:1.05,el:88,glass:0xe6f6ff,cloud:0xffffff,disc:1,ambient:0xffffff,ambI:0},
  afternoon:{name:'Afternoon',icon:'🌇',sub:'Warm golden light',sky:0xf5c89a,hemiSky:0xffe2b8,hemiGnd:0xc9a08a,hemiI:.85,sun:0xffb766,sunI:.85,el:26,glass:0xffd9a8,cloud:0xffe3c4,disc:1,ambient:0xffffff,ambI:0},
  evening:  {name:'Evening',icon:'🌙',sub:'Dusky and calm',sky:0x34305f,hemiSky:0x9a96d8,hemiGnd:0x4a4468,hemiI:.62,sun:0x8f8fe0,sunI:.32,el:16,glass:0x4a4a86,cloud:0x7d78b4,disc:.0,ambient:0xffffff,ambI:0}
 };
 const hemi=scene.children.find(o=>o.isHemisphereLight);
 // remember the original look of this map
 const sunHD=Math.hypot(sun.position.x,sun.position.z)||1,sunLen=sun.position.length(),sunAz=Math.atan2(sun.position.z,sun.position.x);
 const orig={sky:scene.background.clone(),hemiSky:hemi?hemi.color.clone():null,hemiGnd:hemi?hemi.groundColor.clone():null,hemiI:hemi?hemi.intensity:0,sun:sun.color.clone(),sunI:sun.intensity,sunPos:sun.position.clone()};
 // tintable bits found by their material colour
 const glass=[],clouds=[],discs=[];
 scene.traverse(o=>{const m=o.material;if(!m||Array.isArray(m)||!m.color)return;const h=m.color.getHex();
  if(h===0xd7ebf7)glass.push({m,c:m.color.clone()});
  else if(o.geometry&&o.geometry.type==='SphereGeometry'&&h===0xffffff&&m.isMeshBasicMaterial&&o.parent&&o.parent.parent===scene&&o.parent.position.y>8)clouds.push({m,c:m.color.clone()});
  else if((h===0xfff0dc||h===0xfff8ea)&&m.isMeshBasicMaterial)discs.push({m,o:m.opacity,c:m.color.clone()});});
 const cur={sky:orig.sky.clone(),hemiSky:orig.hemiSky&&orig.hemiSky.clone(),hemiGnd:orig.hemiGnd&&orig.hemiGnd.clone(),hemiI:orig.hemiI,sun:orig.sun.clone(),sunI:orig.sunI,sunPos:orig.sunPos.clone(),glass:glass[0]?glass[0].c.clone():null,cloud:new C(0xffffff),disc:1};
 let goal=null,tgt=null;
 const col=h=>new C(h);
 function setPreset(k){
  const p=PRESETS[k];if(!p)return;
  const el=p.el*Math.PI/180;
  tgt={sky:col(p.sky),hemiSky:col(p.hemiSky),hemiGnd:col(p.hemiGnd),hemiI:p.hemiI,sun:col(p.sun),sunI:p.sunI,
   sunPos:new THREE.Vector3(Math.cos(sunAz)*Math.cos(el)*sunLen,Math.sin(el)*sunLen,Math.sin(sunAz)*Math.cos(el)*sunLen),
   glass:col(p.glass),cloud:col(p.cloud),disc:p.disc};
  goal=k;
 }
 function apply(dt){
  if(!tgt)return;const a=1-Math.exp(-dt*3.2);let moving=false;
  const lc=(c,t)=>{if(!c||!t)return;c.lerp(t,a);};
  lc(cur.sky,tgt.sky);lc(cur.hemiSky,tgt.hemiSky);lc(cur.hemiGnd,tgt.hemiGnd);lc(cur.sun,tgt.sun);lc(cur.glass,tgt.glass);lc(cur.cloud,tgt.cloud);
  cur.hemiI+=(tgt.hemiI-cur.hemiI)*a;cur.sunI+=(tgt.sunI-cur.sunI)*a;cur.disc+=(tgt.disc-cur.disc)*a;cur.sunPos.lerp(tgt.sunPos,a);
  scene.background.copy(cur.sky);if(scene.fog)scene.fog.color.copy(cur.sky);
  if(hemi){hemi.color.copy(cur.hemiSky);hemi.groundColor.copy(cur.hemiGnd);hemi.intensity=cur.hemiI;}
  sun.color.copy(cur.sun);sun.intensity=cur.sunI;sun.position.copy(cur.sunPos);
  glass.forEach(g=>g.m.color.copy(cur.glass));clouds.forEach(g=>g.m.color.copy(cur.cloud));
  discs.forEach(d=>{d.m.opacity=d.o*Math.max(0,cur.disc);d.m.visible=cur.disc>.03;});
  const hex='#'+cur.sky.getHexString();document.documentElement.style.setProperty('--sky',hex);document.body.style.background=hex;
  const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.setAttribute('content',hex);
 }
 let last=performance.now();(function tick(n){requestAnimationFrame(tick);const dt=Math.min(.1,(n-last)/1000);last=n;apply(dt);})(last);

 // ---- UI ----
 const btn=document.getElementById('fxBtn'),menu=document.getElementById('fxMenu'),items={};
 Object.keys(PRESETS).forEach(k=>{const p=PRESETS[k],b=document.createElement('button');
  b.innerHTML='<span class="ic">'+p.icon+'</span><span>'+p.name+'<small>'+p.sub+'</small></span>';
  b.onclick=()=>{choose(k);menu.classList.remove('open');};menu.appendChild(b);items[k]=b;});
 function choose(k,silent){setPreset(k);Object.keys(items).forEach(i=>items[i].classList.toggle('sel',i===k));if(!silent)try{localStorage.setItem('worldTimeOfDay',k);}catch(e){}}
 const tog=v=>menu.classList.toggle('open',v);
 ['pointerdown','touchstart','mousedown'].forEach(ev=>{btn.addEventListener(ev,e=>e.stopPropagation());menu.addEventListener(ev,e=>e.stopPropagation());});
 btn.onclick=e=>{e.stopPropagation();tog();};
 addEventListener('pointerdown',e=>{if(!menu.contains(e.target)&&e.target!==btn&&!btn.contains(e.target))tog(false);});
 addEventListener('keydown',e=>{if(e.key==='Escape')tog(false);else if((e.key==='e'||e.key==='E')&&!e.ctrlKey&&!e.metaKey&&!e.altKey)tog();});
 // keep the chosen time of day when teleporting between maps
 let saved=null;try{saved=localStorage.getItem('worldTimeOfDay');}catch(e){}
 if(saved&&PRESETS[saved]){choose(saved,true);// start instantly, no fade-in from default
  for(let i=0;i<40;i++)apply(.5);}
})();
</script>
<!-- SHADOW CAT NPC (red eyes) -->
<script>
(function(){
 const T3=THREE,title=document.title;
 const MK=/bedroom/i.test(title)?'bed':/field/i.test(title)?'field':'plaza';
 const BB=MK==='bed'?[-6.2,6.2,-4.2,4.2]:MK==='field'?[-21,21,-21,21]:[-16,20,-17,20];
 const inReg=MK==='bed'?(x,z)=>Math.abs(x)<6.2&&Math.abs(z)<4.2:MK==='field'?(x,z)=>Math.hypot(x,z)<21:(x,z)=>x>-16&&x<20&&z>-17&&z<20;
 const rn=(a,b)=>a+Math.random()*(b-a);
 const free=(x,z,c)=>decor.every(k=>k.soft||k.r<=0||Math.hypot(x-k.x,z-k.z)>k.r+c);
 function spot(ok,clear){for(let i=0;i<90;i++){const x=rn(BB[0],BB[1]),z=rn(BB[2],BB[3]);if(inReg(x,z)&&free(x,z,i<60?clear:.5)&&(!ok||ok(x,z)))return{x,z};}return null;}
 function mkTex(stops){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);stops.forEach(s=>gr.addColorStop(s[0],s[1]));g.fillStyle=gr;g.fillRect(0,0,64,64);return new T3.CanvasTexture(c);}
 const glowTex=mkTex([[0,'rgba(255,80,60,.95)'],[.35,'rgba(255,20,20,.45)'],[1,'rgba(255,0,0,0)']]);
 const smokeTex=mkTex([[0,'rgba(22,10,34,.95)'],[.5,'rgba(22,10,34,.45)'],[1,'rgba(22,10,34,0)']]);

 // ---- the cat: charcoal-black, purple-tinted, glowing red eyes ----
 const BODY=0x15111c,gy=player.position.y;
 const w=cat(BODY,0x3b2650);w.position.set(0,gy,0);w.visible=false;scene.add(w);
 const B=w.userData.body,U=B.userData,mats=new Set(),eyeMats=[],glows=[];
 w.traverse(o=>{if(!o.isMesh)return;const m=o.material;if(!m||m.isMeshBasicMaterial)return;
  if(m.vertexColors){const a=o.geometry.attributes.color,c=new T3.Color(BODY);for(let i=0;i<a.count;i++)a.setXYZ(i,c.r,c.g,c.b);a.needsUpdate=true;}
  else{const h=m.color.getHex(),r=h>>16&255,g=h>>8&255,b=h&255;
   if(r>200&&g>200&&b>200)m.color.setHex(0x241d2e);       // white patches -> shadow grey
   else if(r>200&&g<200)m.color.setHex(0x2d2238);          // pink pads / nose -> dusk purple
   else if(h===0xa88e9c)m.color.setHex(0x5a4d6b);}         // whiskers
  m.emissive.setHex(0x150c20);mats.add(m);});
 U.eyes.forEach(e=>{
  e.geometry=new T3.SphereGeometry(.13,12,10);
  e.material=new T3.MeshBasicMaterial({color:0xff1414,transparent:true});eyeMats.push(e.material);
  const pu=mesh(new T3.SphereGeometry(.05,8,8),new T3.MeshBasicMaterial({color:0x120000,transparent:true}),e.position.x,e.position.y,e.position.z+.11);
  pu.scale.set(.32,1.7,.9);U.top.add(pu);eyeMats.push(pu.material);   // slit pupil
  const gl=new T3.Sprite(new T3.SpriteMaterial({map:glowTex,transparent:true,depthWrite:false,opacity:.7}));
  gl.scale.set(.8,.8,1);gl.position.set(e.position.x,e.position.y,e.position.z+.14);U.top.add(gl);glows.push(gl);eyeMats.push(gl.material);});
 U.hls.forEach(h=>{const s=h.position.x>0?1:-1;h.position.set(s*.24,1.61,.77);h.material.color.setHex(0xffd6d6);h.material.transparent=true;eyeMats.push(h.material);});
 const rl=new T3.PointLight(0xff2020,.5,5);rl.position.set(0,1.6,1);U.top.add(rl);

 // ground shadow pool
 const pool=mesh(new T3.PlaneGeometry(2.8,2.8),new T3.MeshBasicMaterial({map:smokeTex,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}),0,gy+.04,0);
 pool.rotation.x=-Math.PI/2;pool.visible=false;scene.add(pool);

 // drifting shadow wisps
 const wisps=[];for(let i=0;i<44;i++){const s=new T3.Sprite(new T3.SpriteMaterial({map:smokeTex,transparent:true,depthWrite:false,opacity:0}));s.visible=false;s.userData={life:0,max:1,vx:0,vy:0,vz:0,sz:1,on:false};scene.add(s);wisps.push(s);}
 function puff(n,burst){for(let k=0;k<n;k++){const s=wisps.find(q=>!q.userData.on);if(!s)return;const u=s.userData,p=w.position;
  s.position.set(p.x+rn(-.55,.55),gy+rn(.15,1.8),p.z+rn(-.55,.55));
  u.on=true;u.life=0;u.max=rn(1.1,2);u.vx=rn(-.3,.3)*(burst?2:1);u.vz=rn(-.3,.3)*(burst?2:1);u.vy=rn(.3,.9);u.sz=rn(.55,1.1)*(burst?1.3:1);s.visible=true;}}

 // ---- behaviour: lurks, stares, melts away if you get close, then re-emerges ----
 let state='hidden',timer=2.5,op=0,goal=null,wait=0,idle=0,liveT=0,stalkT=0,lk=0,T=0,acc=0,last=performance.now();
 const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
 function place(){const P=player.position;
  let s=spot((x,z)=>{const d=Math.hypot(x-P.x,z-P.z);return d>6&&d<12;},1.2)||spot((x,z)=>Math.hypot(x-P.x,z-P.z)>5,.9)||spot(null,.7)||{x:0,z:0};
  w.position.set(s.x,gy,s.z);w.rotation.y=Math.atan2(P.x-s.x,P.z-s.z);goal=null;wait=2+Math.random()*2;idle=0;}
 function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  const P=player.position,p=w.position,dx=P.x-p.x,dz=P.z-p.z,dp=Math.hypot(dx,dz);let spd=0;
  if(state==='hidden'){timer-=dt;if(timer<=0){place();state='in';w.visible=true;puff(14,true);}}
  else if(state==='in'){op=Math.min(1,op+dt/.9);if(op>=1){state='live';liveT=0;stalkT=rn(25,45);}}
  else if(state==='live'){
   liveT+=dt;stalkT-=dt;
   if((dp<3.2&&liveT>1.2)||stalkT<=0){state='out';puff(16,true);}
   else if(wait>0){wait-=dt;idle+=dt;
    if(dp<12){p.y=gy;w.rotation.y+=wrap(Math.atan2(dx,dz)-w.rotation.y)*Math.min(1,dt*2);}}   // sits and stares at you
   else if(!goal){const s=spot((x,z)=>{const d=Math.hypot(x-p.x,z-p.z);return d>3&&d<8;},.9);if(s)goal=s;else wait=2;}
   else{spd=2.1;idle=0;if(walk(w,goal,spd,dt,true)){goal=null;wait=3+Math.random()*4;spd=0;}}
  }
  else if(state==='out'){op=Math.max(0,op-dt/.7);if(op<=0){state='hidden';timer=rn(4,9);w.visible=false;}}
  p.y=gy;
  if(w.visible){
   anim(w,spd,T,dt,Math.min(idle,9));                  // idle capped so it sits and stares, never sleeps
   if(dp<16){let a=Math.max(-.9,Math.min(.9,wrap(Math.atan2(dx,dz)-w.rotation.y)));lk+=(a-lk)*Math.min(1,dt*4);U.top.rotation.y=lk;}
  }
  // fade + glow
  mats.forEach(m=>{m.transparent=op<.995;m.opacity=op;});
  const eo=Math.pow(op,.45),pulse=.6+.2*Math.sin(T*3.1)+(dp<9?.2:0);
  eyeMats.forEach(m=>{if(!m.map)m.opacity=eo;});glows.forEach(g=>g.material.opacity=eo*pulse);
  rl.intensity=.5*eo*(.8+.2*Math.sin(T*3.1));
  pool.visible=op>.01;pool.position.x=p.x;pool.position.z=p.z;pool.material.opacity=.7*op*(.85+.15*Math.sin(T*1.7));
  // wisps
  if(w.visible){acc+=dt*14*op;while(acc>=1){acc--;puff(1,false);}}
  wisps.forEach(s=>{const u=s.userData;if(!u.on)return;u.life+=dt;const k=u.life/u.max;
   if(k>=1){u.on=false;s.visible=false;return;}
   s.position.x+=u.vx*dt;s.position.y+=u.vy*dt;s.position.z+=u.vz*dt;
   const sc=u.sz*(.8+k*1.4);s.scale.set(sc,sc,1);s.material.opacity=Math.sin(Math.PI*k)*.55;});
 }
 requestAnimationFrame(tick);
})();
</script>
